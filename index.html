<style>
:root{
  --navy:#1B3A5C; --navy-2:#24507D; --gold:#C9A227; --gold-soft:#F5E9C0;
  --slate:#0F172A; --slate-2:#1E293B; --bg:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --mut:#64748B; --amber:#B45309; --amber-bg:#FEF3C7;
  --emer:#047857; --emer-bg:#D1FAE5; --blue:#1D4ED8; --blue-bg:#DBEAFE;
  --red:#B91C1C; --red-bg:#FEE2E2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.num{direction:ltr; text-align:left; font-variant-numeric:tabular-nums; unicode-bidi:isolate}
.app{display:flex; min-height:100vh}

/* ---------- الشريط الجانبي ---------- */
.sidebar{background:var(--slate); color:#fff; width:250px; flex:0 0 250px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
.side-head{display:flex; align-items:center; gap:11px; padding:16px 16px; border-bottom:1px solid var(--slate-2)}
.side-logo{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:0 0 46px}
.side-name{font-weight:700;font-size:14.5px;line-height:1.3}
.side-sub{font-size:10.5px;color:#94A3B8}
.back-btn{display:none;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 12px;border:1px solid #334155;
  background:var(--slate-2);color:#CBD5E1;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.back-btn:hover{background:#334155;color:#fff}
.nav{padding:10px 10px; overflow-y:auto; flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:3px;color:#CBD5E1;text-decoration:none;border-radius:9px;font-size:13.5px;cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:right}
.nav a:hover{background:var(--slate-2);color:#fff}
.nav a.on{background:var(--navy);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:19px;text-align:center;opacity:.9;font-size:15px}
.nav .badge{margin-inline-start:auto;background:#334155;color:#E2E8F0;border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.side-foot{padding:10px 14px;border-top:1px solid var(--slate-2);font-size:11px;color:#64748B;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}

/* ---------- المحتوى ---------- */
.main{flex:1; min-width:0; padding:20px 24px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1.page{font-size:22px;font-weight:800;color:var(--navy);margin:0}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3F2E00}
.btn.gold:hover{background:#B8931F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:#16304C}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:6px 9px}
.btn.ghost:hover{background:#E2E8F0;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#FCA5A5}
.btn.danger:hover{background:var(--red-bg)}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-t{font-weight:700;color:var(--navy);font-size:14.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.amber:after{background:#D97706}.kpi.emer:after{background:#059669}.kpi.blue:after{background:#2563EB}.kpi.navy:after{background:var(--navy)}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.kpi .hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.cur{font-size:13px;font-weight:600;color:var(--mut);margin-inline-start:3px}

table{width:100%;border-collapse:collapse}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.num{text-align:left}
tbody td{padding:9px 12px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#F1F5F9}
tbody tr.clk{cursor:pointer}
.tbl-wrap{overflow:auto;border-radius:0 0 14px 14px;max-height:70vh}
tfoot td{padding:10px 12px;border-top:2px solid var(--navy);font-weight:800;background:#F8FAFC;font-size:13.5px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.emer{background:var(--emer-bg);color:var(--emer)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.gray{background:#F1F5F9;color:var(--mut)}
.chip.gold{background:var(--gold-soft);color:#7A5C00}

.search{position:relative;flex:0 0 300px;max-width:100%}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 36px 9px 12px;background:#fff}
.search:before{content:"⌕";position:absolute;inset-inline-start:12px;top:6px;font-size:18px;color:var(--mut)}
input,select,textarea{border:1px solid #CBD5E1;border-radius:9px;padding:8px 11px;background:#fff;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
.f{margin-bottom:13px}
.money{font-size:17px;font-weight:700;text-align:left;direction:ltr;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tabs button:hover{background:#F1F5F9;color:var(--ink)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold);background:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .big{font-size:36px;opacity:.35;margin-bottom:8px}

/* ---------- المودال ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 22px 50px rgba(0,0,0,.28);animation:pop .16s ease-out}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:2px solid var(--gold)}
.modal-h .t{font-weight:800;color:var(--navy);font-size:16px;flex:1}
.modal-b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-start;padding:13px 20px;border-top:1px solid var(--line);background:#F8FAFC;border-radius:0 0 16px 16px}
.x{border:none;background:#F1F5F9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--mut);line-height:1}
.x:hover{background:#E2E8F0;color:var(--ink)}

.calc-box{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13px}
.calc-box .ln{display:flex;justify-content:space-between;padding:3px 0}
.calc-box .ln.tot{border-top:1px solid #CBD5E1;margin-top:5px;padding-top:7px;font-weight:800;color:var(--navy);font-size:15px}

.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--slate);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:99;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;animation:pop .18s}
.toast.ok{background:#065F46}.toast.err{background:#991B1B}

.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#78350F;margin-bottom:12px}
.hint-k{font-size:11.5px;color:var(--mut);margin-top:4px}
kbd{background:#F1F5F9;border:1px solid #CBD5E1;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;color:#334155}


/* ---------- إضافات ---------- */
.nav .badge.red{background:#B91C1C;color:#fff}
.kpi.gold:after{background:var(--gold)}
.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:13px;border-inline-start:3px solid transparent;transition:.15s}
.alert:hover{background:#F1F5F9}
.alert.red{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.alert.amber{background:#FFFBEB;border-color:#D97706;color:#78350F}
.alert.blue{background:#EFF6FF;border-color:#2563EB;color:#1E3A8A}
.mini-l{font-size:11.5px;color:var(--mut);font-weight:600}
.mini-v{font-size:18px;font-weight:800}
.res{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.res:hover,.res.on{background:#F1F5F9;border-color:var(--line)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;color:var(--navy)}
.res .t span{font-size:11.5px;color:var(--mut)}



.crash{position:fixed;inset-inline:16px;bottom:16px;background:#7F1D1D;color:#fff;border-radius:12px;padding:13px 17px;z-index:150;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.crash button{margin-inline-start:10px;background:#fff;color:#7F1D1D;border:none;border-radius:8px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:inherit}
/* ---------- التحديد المتعدد وقائمة الزر الأيمن ---------- */
tbody tr.selrow,tbody tr.selrow:nth-child(even){background:#DBEAFE !important}
tbody tr.selrow td{border-top-color:#93C5FD}
tbody tr.selrow td:first-child{box-shadow:inset 3px 0 0 #1D4ED8 !important}
tbody tr.selectable{cursor:default;user-select:none}
tbody tr.inrow,tbody tr.inrow:nth-child(even){background:#ECFDF5}
tbody tr.inrow td:first-child{box-shadow:inset 3px 0 0 #059669}
/* ---------- الطباعة ---------- */
.letterhead{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:20px}
.lh-logo{width:88px;height:auto;object-fit:contain}
.lh-ar{font-weight:800;font-size:18px;color:var(--navy);line-height:1.35}
.lh-en{font-size:10px;color:#94A3B8;letter-spacing:.04em;margin-top:3px}
.doc-title{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:18px;font-weight:700}
.doc-ref{font-size:11px;opacity:.85;font-weight:400}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:46px;break-inside:avoid}
.sign-line{border-top:1px solid #94A3B8;padding-top:8px;color:#64748B;font-size:13px;text-align:center}
.doc-footer{text-align:center;font-size:10.5px;color:#94A3B8;margin-top:26px}
/* ===== مقاسات الطباعة — جداول البيانات في كل التقارير (#printArea table.pt) =====
   pt = جدول بيانات (ليه عناوين أعمدة). السندات والمستخلصات (جداول من غير عناوين) فاضلة بمقاسها. */
#printArea table.pt{width:100%;max-width:100%;border-collapse:collapse;font-size:10.5px}
#printArea table.pt thead th{position:static;padding:5px 6px;font-size:10px;line-height:1.35;white-space:normal;vertical-align:bottom}
#printArea table.pt tbody td{padding:4px 6px;font-size:10.5px;line-height:1.45;vertical-align:top}
#printArea table.pt tfoot td{padding:5px 6px;font-size:11px}
#printArea table.pt td,#printArea table.pt th{overflow-wrap:break-word}
#printArea .num,#printArea td.dt{white-space:nowrap}
#printArea table.pt .chip{font-size:9.5px;padding:1px 7px}
/* التوقيعات والسطر الأخير مايتفصلوش لوحدهم في صفحة فاضية */
#printArea .sign-row,#printArea .keepnext{break-after:avoid}
#printArea .doc-footer{break-before:avoid}
/* لو الجدول لسه أعرض من الورقة — البرنامج بيزوّد الدرجة لوحده (fitPrint) */
#printArea table.pf1 thead th{font-size:9.5px;padding:4px 4px}
#printArea table.pf1 tbody td,#printArea table.pf1 tfoot td{font-size:9.5px;padding:3px 4px}
#printArea table.pf2 thead th{font-size:8.5px;padding:3px 3px}
#printArea table.pf2 tbody td,#printArea table.pf2 tfoot td{font-size:8.5px;padding:3px 3px}
#printArea table.pf2 .chip{font-size:8px;padding:0 5px}
#printArea table.pf3 thead th{font-size:7.5px;padding:2px 2px}
#printArea table.pf3 tbody td,#printArea table.pf3 tfoot td{font-size:7.5px;padding:2px 2px}
#printArea table.pf3 .chip{font-size:7px;padding:0 4px}
#printArea table.pf4 .num,#printArea table.pf4 td.dt{white-space:normal}
/* القاعدة: كل مشروع لوحده — عنوان المشروع وإجماليه جوه الجداول */
tr.projhead td{background:#EEF2F7;color:var(--navy);font-weight:800;font-size:13px;border-top:2px solid var(--gold);padding-top:9px;padding-bottom:9px}
tr.projhead td .pc{font-weight:500;font-size:11.5px;color:var(--mut);margin-inline-start:8px}
tr.projsub td{background:#F8FAFC;font-weight:800;border-top:1px solid #94A3B8;color:var(--navy)}
tr.projsub td:first-child{color:var(--mut);font-weight:700}
tfoot tr.projgrand td{background:#FFFBEB;border-top:3px double var(--navy);font-size:14px}
.projsum td.pn{font-weight:800;color:var(--navy)}
@media print{tr.projhead td,tr.projsub td,tfoot tr.projgrand td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@keyframes flashrow{0%,45%{background:#FDE68A}100%{background:transparent}}
tr.flashrow td{animation:flashrow 2.4s ease-out}
#printArea{display:none}

<script>
/* ====================== المزامنة السحابية (Google Apps Script) + طبقة الموبايل ====================== */
const MOBILE = !!window.MOBILE;
const COLS = ['projects', 'sections', 'items', 'moves'];
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
/* كل جهاز له نطاق أرقام خاص بيه علشان الأرقام ما تتعارضش بين اللاب والموبايل */
const DEVBASE = (() => { if (!MOBILE) return 0; let b = LS.get('alt_devbase', 0); if (!b) { b = (1 + Math.floor(Math.random() * 8000)) * 1e9; LS.set('alt_devbase', b); } return b; })();
const r4s = x => Math.round(x * 10000) / 10000;
function h53(s) { let a = 0x811c9dc5, b = 0xdeadbeef; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619) >>> 0; b = Math.imul(b ^ c, 2246822519) >>> 0; b ^= b >>> 13; } return a.toString(36) + b.toString(36); }
const hashesOf = db => { const h = {}, q = {}; COLS.forEach(k => { const m = h[k] = {}; (db[k] || []).forEach(r => { m[r.id] = h53(JSON.stringify(r)); if (k === 'items') q[r.id] = r.qty; }); }); return { h, q }; };
function diffAgainst(base, db) {
  const ch = { up: {}, del: {}, dq: {}, any: false };
  COLS.forEach(k => {
    const bh = base.h[k] || {}, seen = {}, up = [];
    (db[k] || []).forEach(r => {
      seen[r.id] = 1; const x = h53(JSON.stringify(r));
      if (bh[r.id] !== x) { up.push(r); if (k === 'items' && bh[r.id] !== undefined) { const d = r4s((r.qty || 0) - ((base.q || {})[r.id] || 0)); if (d) ch.dq[r.id] = d; } }
    });
    const del = Object.keys(bh).filter(id => !seen[id]).map(Number);
    ch.up[k] = up; ch.del[k] = del; if (up.length || del.length) ch.any = true;
  });
  return ch;
}
function applyChangesLocal(db, ch) {
  COLS.forEach(k => {
    const arr = db[k], idx = {}; arr.forEach((r, i) => { idx[r.id] = i; });
    (ch.up[k] || []).forEach(r => {
      const i = idx[r.id]; let rec = r;
      if (k === 'items' && i !== undefined) { rec = Object.assign({}, r); rec.qty = r4s((arr[i].qty || 0) + (ch.dq[r.id] || 0)); }
      if (i !== undefined) arr[i] = rec; else { idx[r.id] = arr.length; arr.push(rec); }
    });
    const del = ch.del[k] || []; if (del.length) { const s = {}; del.forEach(id => { s[id] = 1; }); db[k] = arr.filter(r => !s[r.id]); }
  });
}
const pickCols = db => { const o = {}; COLS.forEach(k => { o[k] = db[k] || []; }); return o; };
const cloneCols = db => JSON.parse(JSON.stringify(pickCols(db)));

/* ---------- حالة السحابة ---------- */
let CLOUD = LS.get('alt_cloud', null);          // { url, token, exp }
const cloudUrl = () => (CLOUD && CLOUD.url) || window.CLOUD_URL || '';
const cloudLinked = () => !!(CLOUD && CLOUD.token && cloudUrl());
const SYNC = { busy: false, again: false, state: cloudLinked() ? 'idle' : 'off', last: LS.get('alt_lastsync', 0), msg: '', timer: null };
function setSync(state, msg) { SYNC.state = state; SYNC.msg = msg || ''; if (typeof updateSideFoot === 'function') updateSideFoot(); document.querySelectorAll('.syncchip').forEach(el => { el.innerHTML = syncChipHtml(); }); document.querySelectorAll('.syncshort').forEach(el => { el.innerHTML = syncShortHtml(); }); }
function syncText() {
  if (!cloudLinked()) return MOBILE ? 'مش متصل بالسحابة' : 'المزامنة مش مفعّلة';
  if (SYNC.state === 'busy') return 'بيزامن…';
  if (SYNC.state === 'err') return SYNC.msg || 'فشلت المزامنة';
  if (SYNC.state === 'offline') return 'من غير نت — هيزامن لما النت يرجع';
  return SYNC.last ? 'اتزامن ' + hm(SYNC.last) : 'جاهز للمزامنة';
}
function syncShortHtml() {
  const st = !cloudLinked() ? 'off' : SYNC.state;
  const t = st === 'off' ? 'غير متصل' : st === 'busy' ? 'بيزامن…' : st === 'err' ? 'خطأ' : st === 'offline' ? 'من غير نت' : (SYNC.last ? hm(SYNC.last) : 'جاهز');
  return `<span class="syncdot ${st}"></span>${esc(t)}`;
}
const syncChipHtml = () => `<span class="syncdot ${cloudLinked() ? SYNC.state : 'off'}"></span>${esc(syncText())}`;

async function cloudPost(body, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 40000);
  let r;
  try { r = await fetch(cloudUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: c.signal, redirect: 'follow' }); }
  catch (e) { const er = new Error(navigator.onLine === false ? 'مفيش نت' : 'مقدرتش أوصل للسحابة'); er.net = true; throw er; }
  finally { clearTimeout(t); }
  let j; try { j = await r.json(); } catch (e) { const er = new Error('رد غير مفهوم من السحابة — تأكد من رابط السكربت'); er.net = true; throw er; }
  if (j.error) { const er = new Error(j.error); er.code = j.code || ''; throw er; }
  return j;
}
function saveCloud() { LS.set('alt_cloud', CLOUD); }
const modalOpen = () => !!($('#modalRoot .ov') || $('#modal2Root .ov'));

/* ---------- المزامنة ---------- */
const dirtyNow = () => { const b = DB._sync; return !b || diffAgainst(b, DB).any; };
function syncSoon(ms) { if (!cloudLinked()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncNow(), ms == null ? 2500 : ms); }
async function syncNow(opt) {
  opt = opt || {};
  if (!cloudLinked() || document.body.classList.contains('locked') || !DB || !DB.sections) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true; if (!opt.quiet) setSync('busy');
  try {
    clearTimeout(saveTimer); await flushSave();
    for (let round = 0; round < 3; round++) {
      let base = DB._sync || null;
      const S = cloneCols(DB), first = !base;
      const ch = first ? { up: S, del: {}, dq: {}, any: true } : diffAgainst(base, S);
      const req = { a: 'sync', token: CLOUD.token, have: base ? base.rev : -1, uid: base ? base.uid : '', first, ch: first ? { up: S } : { up: ch.up, del: ch.del, dq: ch.dq } };
      let res = await cloudPost(req);
      if (res.mismatch) { DB._sync = null; continue; }            // سكربت/ملف بيانات مختلف — ابدأ ربط جديد
      if (res.same) { SYNC.last = Date.now(); LS.set('alt_lastsync', SYNC.last); break; }
      const server = res.db, serverCopy = JSON.parse(JSON.stringify(server));
      const sBase = hashesOf(S), ch2 = diffAgainst(sBase, pickCols(DB));       // اللي اتغيّر أثناء الطلب
      const merged = JSON.parse(JSON.stringify(server));
      if (ch2.any) applyChangesLocal(merged, ch2);
      const before = JSON.stringify(pickCols(DB));
      COLS.forEach(k => { DB[k] = merged[k]; });
      const hb = hashesOf(serverCopy); DB._sync = { rev: res.rev, uid: res.uid || '', h: hb.h, q: hb.q };
      const changedByRemote = before !== JSON.stringify(pickCols(DB));
      DB.seq = cleanDB(DB).seq;
      await flushSave();
      SYNC.last = Date.now(); LS.set('alt_lastsync', SYNC.last);
      if (changedByRemote && !modalOpen()) render(true);
      if (!ch2.any) break;
    }
    setSync('idle');
  } catch (e) {
    if (e.code === 'auth') { CLOUD.token = ''; saveCloud(); setSync('err', 'انتهت جلسة السحابة — سجّل دخول تاني'); if (MOBILE) { try { sessionStorage.removeItem('alt_unl'); } catch (x) { } lockNow(); } }
    else if (e.net) setSync('offline'); else setSync('err', e.message);
  }
  SYNC.busy = false;
  if (SYNC.again) { SYNC.again = false; syncSoon(500); }
}
setInterval(() => { if (document.visibilityState === 'visible') syncNow({ quiet: true }); }, 45000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncSoon(300); });

/* ---------- ربط اللاب بالسحابة (من الإعدادات) ---------- */

  return hexOf(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, k, 256));
}

function safeEvalFormula(expr) {
  const ad = '٠١٢٣٤٥٦٧٨٩';
  let s = String(expr).replace(/[٠-٩]/g, d => ad.indexOf(d));
  s = s.replace(/,/g, '').replace(/[^0-9+\-*/(). ]/g, '');
  let i = 0;
  const peek = () => s[i], skip = () => { while (s[i] === ' ') i++; };
  function parseExpr() { skip(); let v = parseTerm(); skip(); while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = parseTerm(); v = op === '+' ? v + r : v - r; skip(); } return v; }
  function parseTerm() { skip(); let v = parseFactor(); skip(); while (peek() === '*' || peek() === '/') { const op = s[i++]; const r = parseFactor(); v = op === '*' ? v * r : (r === 0 ? 0 : v / r); skip(); } return v; }
  function parseFactor() { skip(); if (peek() === '+') { i++; return parseFactor(); } if (peek() === '-') { i++; return -parseFactor(); } if (peek() === '(') { i++; const v = parseExpr(); skip(); if (peek() === ')') i++; return v; } const st = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; const n = parseFloat(s.slice(st, i)); return isNaN(n) ? 0 : n; }
  try { const r = parseExpr(); return isFinite(r) ? r : 0; } catch (e) { return 0; }
}

function parseFlexibleDate(input) {
  const ad = '٠١٢٣٤٥٦٧٨٩';
  let s = String(input == null ? '' : input).trim().replace(/[٠-٩]/g, d => ad.indexOf(d));
  if (!s) return '';
  const hasSep = /[/\-.\s]/.test(s);
  const digits = s.replace(/\D/g, '');
  let dd, mm, yyyy;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const t = s.split('-'); yyyy = t[0]; mm = t[1]; dd = t[2]; }
  else if (!hasSep && digits.length === 8) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = digits.slice(4); }
  else if (!hasSep && digits.length === 6) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = '20' + digits.slice(4); }
  else {
    const parts = s.split(/[/\-.\s]+/).filter(Boolean);
    if (parts.length !== 3) return '';
    dd = parts[0]; mm = parts[1]; yyyy = parts[2];
    if (dd.length === 4) { const t = dd; dd = yyyy; yyyy = t; }
    if (yyyy.length === 2) yyyy = '20' + yyyy;
  }
  dd = String(dd).padStart(2, '0'); mm = String(mm).padStart(2, '0');
  const d = +dd, m = +mm, y = +yyyy;
  if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  const probe = new Date(yyyy + '-' + mm + '-' + dd + 'T00:00:00');
  if (probe.getMonth() + 1 !== m || probe.getDate() !== d) return '';
  return yyyy + '-' + mm + '-' + dd;
}

function wireInputs(root, focusFirst) {
  root.querySelectorAll('input[data-money]').forEach(el => {
    if (el._w) return; el._w = 1;
    el.setAttribute('dir', 'ltr'); el.setAttribute('inputmode', 'decimal');
    if (!el.placeholder) el.placeholder = '0 — أو ابدأ بـ = لكتابة معادلة';
    el.addEventListener('input', () => {
      if (el.value.startsWith('=')) return;
      const caretFromEnd = el.value.length - el.selectionStart;
      let v = toEnDigits(el.value).replace(/[^0-9.]/g, '');
      const parts = v.split('.');
      const dec = parts.length > 1 ? parts.slice(1).join('').slice(0, 4) : null;
      const intFmt = parts[0] === '' ? '' : Number(parts[0]).toLocaleString('en-US');
      el.value = intFmt + (dec !== null ? '.' + dec : '');
      const pos = Math.max(0, el.value.length - caretFromEnd);
      try { el.setSelectionRange(pos, pos); } catch (e) { }
      if (el.dataset.live && window[el.dataset.live]) window[el.dataset.live](el);
    });
    const commit = () => {
      if (el.value.startsWith('=')) {
        el.value = fmtQ(r4(safeEvalFormula(el.value.slice(1))));
        if (el.dataset.live && window[el.dataset.live]) window[el.dataset.live](el);
      }
    };
    el.addEventListener('blur', commit);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && el.value.startsWith('=')) commit(); });
  });
  root.querySelectorAll('input[data-date]').forEach(el => {
    if (el._w) return; el._w = 1;
    el.setAttribute('dir', 'ltr'); el.setAttribute('inputmode', 'numeric');
    if (!el.placeholder) el.placeholder = 'يوم-شهر-سنة — اكتب 01022026';
    el.addEventListener('input', () => {
      const d = toEnDigits(el.value).replace(/\D/g, '').slice(0, 8);
      let out = d.slice(0, 2);
      if (d.length > 2) out += '-' + d.slice(2, 4);
      if (d.length > 4) out += '-' + d.slice(4, 8);
      el.value = out;
      if (el.dataset.live && window[el.dataset.live]) window[el.dataset.live](el);
    });
    el.addEventListener('blur', () => { const iso = parseFlexibleDate(el.value); if (iso) el.value = dsp(iso); });
  });
  /* تكملة بالـTab: «حد» ← حديد */
  root.querySelectorAll('input[data-complete]').forEach(el => {
    if (el._c) return; el._c = 1;
    el.addEventListener('keydown', e => {
      if (e.key !== 'Tab' || e.shiftKey || !el.value.trim()) return;
      const opts = (completeOptions[el.dataset.complete] ? completeOptions[el.dataset.complete](el) : []);
      const t = norm(el.value);
      if (opts.some(o => norm(o) === t)) return;
      const pick = opts.find(o => norm(o).startsWith(t)) || opts.find(o => norm(o).includes(t));
      if (pick) { el.value = pick; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }
    });
  });
  if (focusFirst) { const first = root.querySelector('input,select,textarea'); if (first) setTimeout(() => first.focus(), 40); }
}

function blankDB() { return { v: 1, seq: 1, projects: [], sections: [], items: [], moves: [], lastBackup: 0, savedAt: 0 }; }
function cleanDB(d) {
  const b = blankDB();
  d = Object.assign(b, d || {});
  ['projects', 'sections', 'items', 'moves'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  const lo = DEVBASE, hi = DEVBASE + 1e9; let mx = lo;
  ['projects', 'sections', 'items', 'moves'].forEach(k => d[k].forEach(x => { if (x.id >= lo && x.id < hi && x.id > mx) mx = x.id; }));
  d.seq = Math.max((d.seq >= lo && d.seq < hi) ? d.seq : lo + 1, mx + 1);
  /* أقسام من غير مشروع (بيانات قبل المشاريع / نسخة قديمة) بتتحط في «المخزن الرئيسي» */
  const orph = d.sections.filter(s => !s.pid || !d.projects.some(p => p.id === s.pid));
  if (orph.length) {

  }
  return d;
}

  const mv = DB.moves.filter(m => iid.has(m.item) && !m.void), td = todayISO();

/* الخيارات المتاحة على المحدد (بتتستخدم في الشريط وفي الكليك اليمين) */
function actionsFor(keys) {
  const g = kindGroup(keys[0]), ids = keys.map(k => parseK(k)[1]), n = ids.length, one = n === 1, acts = [];
  const A = (ic, t, fn, o) => acts.push(Object.assign({ ic, t, fn }, o || {}));
  const SEP = () => acts.push({ sep: 1 });
  let head = '';
  if (g === 'item') {
    const its = ids.map(itemOf).filter(Boolean); if (!its.length) return { head: '', acts: [] };
    head = one ? '📦 ' + its[0].name : '📦 ' + n + ' أصناف محددة';
    if (one) { A('✎', 'تعديل', () => editItem(ids[0]), { k: 'F2', ctxOnly: 1 }); }
    A('⬇', one ? 'وارد' : 'إدخال للمحدد', () => openBulk('in', 0, ids));
    A('⬆', one ? 'صرف' : 'صرف للمحدد', () => openBulk('out', 0, ids));
    if (one) A('📋', 'كشف حركة الصنف', () => itemCard(ids[0]), { ctxOnly: 1 });
    if (!one || true) SEP();
    A('🏢', 'نقل لقسم…', () => moveItemsSec(ids));
    A('⚠', 'حد التنبيه…', () => setMinItems(ids));
    SEP();
    A('🗑', one ? 'مسح' : 'مسح (' + n + ')', () => delItems(ids), { danger: 1, k: 'Del' });
  } else if (g === 'proj') {
    const ps = ids.map(projOf).filter(Boolean); if (!ps.length) return { head: '', acts: [] };
    head = one ? '🏗 ' + ps[0].name : '🏗 ' + n + ' مشاريع محددة';
    if (one) { A('📂', 'فتح المشروع', () => openProject(ids[0]), { k: 'Enter' }); A('✎', 'تعديل', () => editProject(ids[0]), { ctxOnly: 1 }); SEP(); }
    A('🗑', one ? 'مسح المشروع' : 'مسح (' + n + ')', () => delProjects(ids), { danger: 1, k: 'Del' });
  } else if (g === 'sec') {
    const ss = ids.map(secOf).filter(Boolean); if (!ss.length) return { head: '', acts: [] };
    head = one ? '🏢 ' + ss[0].name : '🏢 ' + n + ' أقسام محددة';
    if (one) {
      A('✎', 'تعديل', () => editSection(ids[0]), { ctxOnly: 1 });

      A('+', 'صنف جديد في القسم', () => { S.secF = ids[0]; editItem(0); });
      A('⬇', 'إدخال لأصنافه', () => { const l = actItems().filter(i => i.sec === ids[0]).map(i => i.id); l.length ? openBulk('in', 0, l) : toast('القسم ده مفيهوش أصناف', 'err'); }, { ctxOnly: 1 });
      SEP();

    const live = ms.filter(m => !m.void);

  return { head, acts };
}
function generalActions() {
  const acts = [], A = (ic, t, fn, o) => acts.push(Object.assign({ ic, t, fn }, o || {}));

/* ====================== الإدخال / الصرف الجماعي ====================== */

  });

async function newCode() {
  const o = $('#pw_code').value; if (!o) return toast('اكتب كلمة السر الحالية', 'err');
  try { const r = await api('/api/newcode', { password: o }); $('#pw_code').value = ''; modal('رمز الاسترجاع الجديد', `<div class="lock-code" dir="ltr" style="background:var(--bg)">${esc(r.code)}</div><div class="note" style="margin-top:12px">اكتبه في ورقة وخبّيها. الرمز القديم بطل يشتغل، والرمز ده بيظهر مرة واحدة بس.</div>`, '<button class="btn gold" onclick="closeModal()">كتبته</button>'); } catch (e) { toast(e.message, 'err'); }
}
async function openDataFolder() { try { await api('/api/open', {}); } catch (e) { toast('مقدرتش أفتح المجلد', 'err'); } }

async function backupNow() { try { await api('/api/backup', {}); INFO = await api('/api/info'); DB.lastBackup = Date.now(); save(); render(true); toast('اتعملت نسخة احتياطية في مجلد backups ✓', 'ok'); } catch (e) { toast('مقدرتش أعمل نسخة: ' + e.message, 'err'); } }
async function restoreBackup(name) {
  let d; try { d = cleanDB(await api('/api/restore?name=' + encodeURIComponent(name))); } catch (e) { return toast('مقدرتش أقرا النسخة دي', 'err'); }
  askYesNo('استرجاع نسخة', `النسخة فيها <b>${d.items.length}</b> صنف و<b>${d.sections.length}</b> قسم و<b>${d.moves.length}</b> حركة.<br>هتستبدل كل البيانات الحالية. <span style="color:var(--mut);font-size:12.5px">(Ctrl+Z بيرجّعك لو غلطت)</span>`, () => { snapshot(); d._sync = DB._sync; DB = d; save(); go('dashboard'); toast('اتسترجعت النسخة ✓', 'ok'); }, 'استرجع', true);
}
function restoreFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); if (!Array.isArray(d.items) || !Array.isArray(d.sections) || !Array.isArray(d.moves)) throw 0; d = cleanDB(d); } catch (e) { inp.value = ''; return toast('الملف ده مش نسخة احتياطية صالحة', 'err'); }
    askYesNo('استرجاع نسخة', `النسخة فيها <b>${d.items.length}</b> صنف و<b>${d.sections.length}</b> قسم و<b>${d.moves.length}</b> حركة.<br>هتستبدل كل البيانات الحالية. <span style="color:var(--mut);font-size:12.5px">(Ctrl+Z بيرجّعك لو غلطت)</span>`, () => { snapshot(); d._sync = DB._sync; DB = d; save(); go('dashboard'); toast('اتسترجعت النسخة ✓', 'ok'); }, 'استرجع', true);
    inp.value = '';
  };
  r.readAsText(f);
}

/* ====================== تشغيل ====================== */
const VIEWS = { projects, dashboard, items, sections, moves, reports, trash, data, settings };
const VIEWS_AFTER = {};
VIEWS_AFTER.data = async () => {
  const el = $('#bkList'); if (!el) return;
  try {
    const r = await api('/api/backups'); const el2 = $('#bkList'); if (!el2) return;
    el2.innerHTML = r.list.length ? '<table><tbody>' + r.list.map(b => `<tr><td>${esc(b.label)}</td><td class="cell-mut">${b.kb} ك.ب</td><td class="act"><button class="btn sm" onclick="restoreBackup('${esc(b.name)}')">استرجاع</button></td></tr>`).join('') + '</tbody></table>' : '<span class="hint-k">مفيش نسخ لسه — أول نسخة تلقائية بتتعمل مع أول تغيير بعد اليوم.</span>';
  } catch (e) { el.textContent = 'مقدرتش أجيب القايمة'; }
};

document.addEventListener('keydown', e => {
  /* بنعتمد على مكان المفتاح (e.code) علشان الاختصارات تشتغل والكيبورد عربي كمان */
  const k = /^Key[A-Z]$/.test(e.code || '') ? e.code[3].toLowerCase() : (e.key || '').toLowerCase();
  if (e.ctrlKey && !e.altKey && ['s', 'o', 'u', 'p'].includes(k)) { e.preventDefault(); if (!document.body.classList.contains('locked')) { if (k === 's') { manualSave(); } else if (k === 'p') toast('الطباعة من صفحة «التقارير»'); } return; }
  if ((e.ctrlKey || e.altKey) && !e.shiftKey && k === 'n') { e.preventDefault(); return handleNew(); }
  if (e.ctrlKey && !e.shiftKey && !e.altKey && (k === 'q' || k === 'w')) { e.preventDefault(); return askExit(); }
  if (e.key === 'F1') { e.preventDefault(); return; }
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(k))) { e.preventDefault(); return; }
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (document.body.classList.contains('locked')) return;
  const modalOpen = !!($('#modalRoot .ov') || $('#modal2Root .ov'));
  if (e.key === 'Escape') { if ($('#ctxMenu')) return closeCtx(); if (!modalOpen && SELN.keys.size) return clearSel(); if ($('#modal2Root .ov')) $('#modal2Root').innerHTML = ''; else if (modalOpen) closeModal(); return; }
  if (e.ctrlKey && k === 'f') { e.preventDefault(); if (gsOpen() || !modalOpen) gsearch(); return; }
  if (modalOpen) return;
  if (e.key === 'F3') { e.preventDefault(); return openBulk('in'); }
  if (e.key === 'F4') { e.preventDefault(); return openBulk('out'); }
  if (typing) return;
  if (e.ctrlKey && k === 'z') { e.preventDefault(); return undo(); }
  if (e.ctrlKey && k === 'a') { if ($('#view tr[data-k]')) { e.preventDefault(); return selectAll(); } }
  if (SELN.keys.size) {
    const keys = [...SELN.keys], g = kindGroup(keys[0]);
    if (e.key === 'F2' && g === 'item' && keys.length === 1) { e.preventDefault(); return editItem(parseK(keys[0])[1]); }
    if (e.key === 'Delete') { e.preventDefault(); const a = actionsFor(keys).acts.find(x => x.k === 'Del'); if (a) return a.fn(); }
  }
});
window.addEventListener('DOMContentLoaded', () => { boot(); });
